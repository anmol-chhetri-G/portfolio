<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gridPulse harness</title>
    <style>
      body { font-family: monospace; padding: 1rem; background: #fff; }
      .grid { display: grid; gap: 0.75rem; justify-content: center; }
      .dot {
        width: 8px; height: 8px; background: #06b6d4;
        border-radius: 50%; display: block;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>

    <script type="module">
      import { initGridPulse, countDots } from '/src/lib/gridPulse.js'

      const gridEl = document.getElementById('grid')
      let controller = null
      let dotEls = []
      let gridSize = [13, 13]
      let minScale = 0.75

      function buildDots() {
        const [cols, rows] = gridSize
        gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`
        gridEl.replaceChildren()
        dotEls = Array.from({ length: countDots(gridSize) }, () => {
          const d = document.createElement('span')
          d.className = 'dot'
          d.style.transform = `scale(${minScale})`
          gridEl.appendChild(d)
          return d
        })
      }

      function scales() {
        return dotEls.map((el) => {
          const m = /scale\(\s*([-\d.e]+)/.exec(el.style.transform)
          return m ? parseFloat(m[1]) : 1
        })
      }

      window.__harness = {
        /** Boot a grid + timeline, left paused so it can be seeked. */
        setup(options = {}) {
          if (controller) { controller.destroy(); controller = null }
          gridSize = options.grid ?? [13, 13]
          minScale = options.minScale ?? 0.7
          buildDots()
          controller = initGridPulse('.dot', options)
          return {
            count: dotEls.length,
            duration: controller.timeline.duration,
            iterationDuration: controller.timeline.iterationDuration,
            paused: controller.timeline.paused,
          }
        },

        /** Render the timeline at an exact time and read every dot's scale. */
        sampleAt(t) {
          controller.timeline.seek(t)
          return { t, scales: scales() }
        },

        /** Raw inline transform of one dot, to see exactly what animejs writes. */
        rawTransform(i) {
          return dotEls[i].style.transform
        },

        /** Iterate a timeline deterministically and describe what happened. */
        profile({ stepMs = 10, untilMs, eps = 0.0001 } = {}) {
          const n = dotEls.length
          if (untilMs === undefined) untilMs = controller.timeline.iterationDuration
          const firstMove = new Array(n).fill(-1)
          const max = new Array(n).fill(-Infinity)
          let lo = Infinity
          let hi = -Infinity
          for (let t = 0; t <= untilMs; t += stepMs) {
            controller.timeline.seek(t)
            const s = scales()
            for (let i = 0; i < n; i++) {
              if (s[i] < lo) lo = s[i]
              if (s[i] > hi) hi = s[i]
              if (s[i] > max[i]) max[i] = s[i]
              if (firstMove[i] < 0 && s[i] - minScale > eps) firstMove[i] = t
            }
          }
          return { firstMove, max, lo, hi }
        },

        destroy() {
          controller?.destroy()
          controller = null
        },
      }

      window.__ready = true
    </script>
  </body>
</html>
