name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The deploy pulls from the clone that already lives on the runner host, so it
# never needs to push back to the repo. Read-only is enough.
permissions:
  contents: read

# Two deploys must never fight over the same working tree / compose project.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # This runner was registered with no custom labels (see `svc.sh install`),
    # so `self-hosted` is the only label it answers to.
    runs-on: self-hosted
    timeout-minutes: 30

    # ---------------------------------------------------------------------
    # Everything tunable lives here. Change these three lines, nothing below.
    # ---------------------------------------------------------------------
    env:
      # The live git clone on the runner host.
      #
      # This is the SAME directory the runner is installed in, which is why
      # this workflow deliberately does NOT use actions/checkout: the
      # self-hosted runner would clone a second, nested copy into
      # actions-runner/_work/anmol-chhetri-G/portfolio/portfolio and the two
      # trees would immediately drift apart.
      DEPLOY_DIR: /home/anmol/portfolio

      # Absolute path to the compose file. Leave empty ('') to auto-detect
      # docker-compose.yml / compose.yml inside DEPLOY_DIR. If neither
      # exists the deploy fails with instructions rather than doing nothing.
      COMPOSE_FILE: ''

      # Optional pre-deploy cooldown helper. Skipped with a notice if it is
      # missing or not executable. If this is actually a post-deploy wait,
      # move the "Pre-deploy sleep" step to just above "Verify".
      SLEEP_SCRIPT: /home/anmol/portfolio/actions-runner/deploymentsafe_sleep.sh

    steps:
      - name: Preflight
        run: |
          set -euo pipefail

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "::error::DEPLOY_DIR='$DEPLOY_DIR' is not a git clone."
            echo "::error::Fix DEPLOY_DIR at the top of this workflow."
            exit 1
          fi

          echo "Deploy dir : $DEPLOY_DIR"
          echo "Host       : $(hostname)"
          echo "Runner pwd : $PWD"
          docker --version

      - name: Pre-deploy sleep
        run: |
          set -euo pipefail
          if [ -x "$SLEEP_SCRIPT" ]; then
            echo "Running $SLEEP_SCRIPT"
            "$SLEEP_SCRIPT"
          elif [ -f "$SLEEP_SCRIPT" ]; then
            echo "::error::$SLEEP_SCRIPT exists but is not executable (chmod +x it)."
            exit 1
          else
            echo "::notice::No script at $SLEEP_SCRIPT, skipping."
          fi

      - name: Pull latest
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"

          git fetch --prune origin
          git checkout "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

          # No `git clean -fd` on purpose: actions-runner/ and its _work/
          # directory live inside this tree and would be deleted, taking the
          # running runner service with them.
          git log --oneline -1

      - name: Resolve compose project
        id: compose
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"

          if [ -n "$COMPOSE_FILE" ]; then
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "::error::COMPOSE_FILE='$COMPOSE_FILE' does not exist."
              exit 1
            fi
            file="$COMPOSE_FILE"
          else
            file=""
            for name in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
              if [ -f "$name" ]; then file="$name"; break; fi
            done
            if [ -z "$file" ]; then
              echo "::error::No compose file found in $DEPLOY_DIR."
              echo "::error::Set COMPOSE_FILE at the top of this workflow to its absolute path."
              echo "::error::Contents of $DEPLOY_DIR:"
              ls -la
              exit 1
            fi
          fi

          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Compose file: $file"
          echo "Services:"
          docker compose -f "$file" config --services

      - name: Build and start
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose -f "${{ steps.compose.outputs.file }}" up -d --build --remove-orphans

      - name: Verify
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          file="${{ steps.compose.outputs.file }}"

          # Give freshly started containers a moment to leave "created".
          for i in $(seq 1 12); do
            if [ -n "$(docker compose -f "$file" ps --status running -q)" ]; then
              break
            fi
            echo "waiting for containers ($i/12)..."
            sleep 5
          done

          docker compose -f "$file" ps

          if [ -z "$(docker compose -f "$file" ps --status running -q)" ]; then
            echo "::error::No containers are running after deploy."
            docker compose -f "$file" logs --tail 50
            exit 1
          fi

      - name: Prune unused images
        run: |
          set -euo pipefail
          docker image prune -f
          docker container prune -f




