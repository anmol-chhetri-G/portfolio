name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The deploy pulls from the clone that already lives on the runner host, so it
# never needs to push back to the repo. Read-only is enough.
permissions:
  contents: read

# Two deploys must never fight over the same working tree.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # This runner was registered with no custom labels (see `svc.sh install`),
    # so `self-hosted` is the only label it answers to.
    runs-on: self-hosted
    timeout-minutes: 30

    # ---------------------------------------------------------------------
    # Everything tunable lives here. Change these lines, nothing below.
    # ---------------------------------------------------------------------
    env:
      # The live git clone on the runner host.
      #
      # This is the SAME directory the runner is installed in, which is why
      # this workflow deliberately does NOT use actions/checkout: the
      # self-hosted runner would clone a second, nested copy into
      # actions-runner/_work/anmol-chhetri-G/portfolio/portfolio and the two
      # trees would immediately drift apart.
      DEPLOY_DIR: /home/anmol/portfolio

      # Optional pre-deploy cooldown helper. Skipped with a notice if it is
      # missing or not executable. If this is actually a post-deploy wait,
      # move the "Pre-deploy sleep" step to just above "Verify".
      SLEEP_SCRIPT: /home/anmol/portfolio/actions-runner/deploymentsafe_sleep.sh

    steps:
      # The runner host has no Node installed (Docker used to supply it).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight
        run: |
          set -euo pipefail

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "::error::DEPLOY_DIR='$DEPLOY_DIR' is not a git clone."
            echo "::error::Fix DEPLOY_DIR at the top of this workflow."
            exit 1
          fi

          echo "Deploy dir : $DEPLOY_DIR"
          echo "Host       : $(hostname)"
          echo "Runner pwd : $PWD"
          node --version

      - name: Pre-deploy sleep
        run: |
          set -euo pipefail
          if [ -x "$SLEEP_SCRIPT" ]; then
            echo "Running $SLEEP_SCRIPT"
            "$SLEEP_SCRIPT"
          elif [ -f "$SLEEP_SCRIPT" ]; then
            echo "::error::$SLEEP_SCRIPT exists but is not executable (chmod +x it)."
            exit 1
          else
            echo "::notice::No script at $SLEEP_SCRIPT, skipping."
          fi

      - name: Pull latest
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"

          git fetch --prune origin
          git checkout "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

          # No `git clean -fd` on purpose: actions-runner/ and its _work/
          # directory live inside this tree and would be deleted, taking the
          # running runner service with them.
          git log --oneline -1

      - name: Build
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          npm ci
          npm run build
